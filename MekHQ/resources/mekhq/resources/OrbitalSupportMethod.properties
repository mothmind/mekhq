OrbitalSupportMethod.FLAT_CHANCE.label=Flat Chance (uncontested)
OrbitalSupportMethod.FLAT_CHANCE.tooltip=Orbital space is not contested. You field whatever naval firepower your own \
  hangar can provide, every scenario, and the opposing force rolls separately against the Enemy Orbital Support \
  Chance below. Both sides can therefore bombard the same battle, or neither.
OrbitalSupportMethod.ORBITAL_CONTEST.label=Orbital Contest (both sides roll)
OrbitalSupportMethod.ORBITAL_CONTEST.tooltip=Each side has its own chance of having a ship in a firing position \
  when the call comes, rolled separately, so a battle can be fought under both fleets, one, or neither. Both start \
  a contract at 40%. The enemy's chance moves with their equipment rating (F -50, D -20, C -10, B none, A +20, \
  A* +40) and with their contract morale, gaining up to twenty points while they are winning and losing up to \
  twenty once they are being beaten. Every space battle in the contract moves both: winning one raises your chance \
  ten points and drops theirs ten, losing one does the reverse. Neither side can pass 95% - a ship can always be \
  out of position, or the orders can fail to arrive. The Enemy Orbital Support Chance spinner below is ignored \
  under this method.
OrbitalSupportMethod.STRATEGY_ROLL.label=Strategy Roll (the staff earns the window)
OrbitalSupportMethod.STRATEGY_ROLL.tooltip=Getting a capital ship into a firing window over a moving battle is a \
  staff problem, so it is rolled as one. Each flagged vessel's commanding officer rolls 2D6 against their Strategy \
  skill and must meet or beat it, using their current final skill number so abilities and injuries both count; \
  double ones always fails. Each ship rolls separately, so a flotilla can arrive in part. The opposing force first \
  has to own a capital ship at all, which its equipment rating decides outright - F never, D 1%, C 15%, B 30%, \
  A 60%, A* always - and then rolls 2D6 against its own force skill, from 9 for Ultra-Green down to 3 for \
  Legendary, a point per step. Modifiers move the roll, not the skill: each space battle in the contract is worth 1 to its winner \
  and costs its loser 1, doubled for a decisive result, and enemy morale helps whoever it favours - a confident \
  enemy gains 1 per step, a demoralised one hands the same to you. The Enemy Orbital Support Chance spinner below \
  is ignored under this method.
