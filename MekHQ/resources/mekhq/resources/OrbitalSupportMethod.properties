OrbitalSupportMethod.FLAT_CHANCE.label=Flat Chance (uncontested)
OrbitalSupportMethod.FLAT_CHANCE.tooltip=Orbital space is not contested. You field whatever naval firepower your own \
  hangar can provide, every scenario, and the opposing force rolls separately against the Enemy Orbital Support \
  Chance below. Both sides can therefore bombard the same battle, or neither.
OrbitalSupportMethod.ORBITAL_CONTEST.label=Orbital Contest (one side holds orbit)
OrbitalSupportMethod.ORBITAL_CONTEST.tooltip=Orbital space above the battlefield is contested and only one fleet can \
  hold it. A single roll each scenario gives you 40%, the enemy 40%, and the remaining 20% to neither - a ship \
  driven off station, a bad firing window, orders that never arrived. The enemy's share follows their contract \
  morale, gaining up to twenty points while they are winning and losing up to twenty once they are being beaten, \
  and shifts back to you for every space battle you win in this contract; losing one shifts it the other way. The \
  Enemy Orbital Support Chance spinner below is ignored under this method.
